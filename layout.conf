# os specific tweaks (Gnome window decoration for wayland)
# linux_display_server x11

# window layout
remember_window_size  no
initial_window_width  1200
initial_window_height 750
window_border_width 1.5pt
enabled_layouts splits,stack
window_padding_width 0
window_margin_width 2
hide_window_decorations yes

# window management 
map ctrl+shift+enter new_window_with_cwd
map alt+backslash launch --location=vsplit --cwd=current
map alt+shift+backslash launch --location=hsplit --cwd=current

# window navigation
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# layout management
map ctrl+shift+l next_layout
map ctrl+alt+s goto_layout stack

# tab bar customization
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom
tab_bar_align left
active_tab_font_style   bold
inactive_tab_font_style normal
tab_bar_edge top

# tab management
map alt+t new_tab_with_cwd
map alt+] next_tab
map alt+[ previous_tab
map alt+w close_window
map alt+shift+w close_tab

tab_title_template "{index}: {title}"
active_tab_title_template "{index}: {title}"

# go to tab N
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9


# resize mode (alt+p to enter, hjkl to resize, esc/enter/alt+p to leave)
map --new-mode resize --on-unknown ignore alt+p
map --mode resize h resize_window narrower
map --mode resize l resize_window wider
map --mode resize k resize_window taller
map --mode resize j resize_window shorter
map --mode resize esc pop_keyboard_mode
map --mode resize enter pop_keyboard_mode
map --mode resize alt+p pop_keyboard_mode

# open predefined layout
# dev workspace (new tab, everything opens in the current directory)
map alt+o combine | launch --type=tab --cwd=current --tab-title dev --title claude | send_text all claude\r | launch --location=before --bias=70 --cwd=current --title main | send_text all nvim\r | launch --location=hsplit --bias=20 --cwd=current --title lazygit | send_text all lazygit\r | neighboring_window up
