# terminal bell
enable_audio_bell no

# scrollback
scrollback_lines 10000
wheel_scroll_multiplier 5.0
touchpad_scroll_multiplier 2.0

# mouse
mouse_hide_wait -1


# scrollback nvim
map alt+e launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting nvim -c "set buftype=nofile" -c "set filetype=terminal" -

# reload config
map ctrl+alt+r load_config_file

# scrollback in pager (replacement for ctrl+shift+h)
map alt+s show_scrollback
