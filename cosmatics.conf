
# themes
include current-theme.conf

# slightly brown foreground (matches nvim)
foreground #6b4a32
cursor     #6b4a32



# terminal opacity and blur
background_opacity 1
background_blur 1

# font
font_family      Victor Mono Medium
bold_family      Victor Mono Bold
italic_family    Victor Mono Medium Italic
bold_italic_family Victor Mono Bold Italic

font_size 13.0

# font size management 
map alt+minus      change_font_size all -2.0
map alt+equal      change_font_size all +2.0

# block / beam / underline
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0
shell_integration no-cursor

# Cursor Trail
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

